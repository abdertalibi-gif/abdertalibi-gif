<svg xmlns="http://www.w3.org/2000/svg" width="260" height="80" viewBox="0 0 260 80" role="img" aria-label="Badge Robot IA animé">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <radialGradient id="eyeB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="gB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="260" height="80" rx="12" fill="url(#badgeBg)" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- mini robot -->
  <g transform="translate(20,10)">
    <!-- antenne -->
    <line x1="30" y1="8" x2="30" y2="0" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="30" cy="-2" r="3" fill="#38BDF8" filter="url(#gB)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- tête -->
    <rect x="10" y="8" width="40" height="28" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- yeux -->
    <circle cx="22" cy="22" r="4" fill="url(#eyeB)"/>
    <circle cx="38" cy="22" r="4" fill="url(#eyeB)"/>
    <!-- corps -->
    <rect x="8" y="38" width="44" height="20" rx="6" fill="#075985" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="30" cy="48" r="4" fill="#38BDF8" filter="url(#gB)">
      <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- texte -->
  <text x="100" y="38" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#FFFFFF">AI ROBOT</text>
  <text x="100" y="56" font-family="JetBrains Mono, monospace" font-size="10" fill="#38BDF8">autonomous · learning</text>
  <circle cx="240" cy="40" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
