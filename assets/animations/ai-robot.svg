<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="Robot IA animé avec antenne, yeux lumineux et flux de données">
  <defs>
    <!-- Dégradé fond -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Dégradé corps robot -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Dégradé tête -->
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Halo yeux -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo cerveau IA -->
    <radialGradient id="brainGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtre lueur -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- FOND -->
  <rect width="800" height="300" fill="url(#bgGrad)"/>
  <g opacity="0.35">
    <circle cx="120" cy="60" r="2" fill="#38BDF8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="90" r="2" fill="#06B6D4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="240" r="2" fill="#38BDF8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="220" r="2" fill="#06B6D4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="40" r="2" fill="#38BDF8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HALO CERVEAU DERRIÈRE LE ROBOT -->
  <circle cx="400" cy="140" r="90" fill="url(#brainGlow)" opacity="0.6">
    <animate attributeName="r" values="85;100;85" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- CONNEXIONS NEURONALES (arcs) -->
  <g stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.7" filter="url(#glow)">
    <path d="M400 140 Q320 80 250 120">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M400 140 Q480 80 550 120">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M400 140 Q320 200 250 170">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M400 140 Q480 200 550 170">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- NŒUDS NEURONAUX -->
  <g fill="#06B6D4" filter="url(#glow)">
    <circle cx="250" cy="120" r="5">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="120" r="5">
      <animate attributeName="r" values="4;7;4" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="170" r="5">
      <animate attributeName="r" values="4;7;4" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="170" r="5">
      <animate attributeName="r" values="4;7;4" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ROBOT — FLOTTEMENT -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-6; 0,0" dur="3s" repeatCount="indefinite"/>

    <!-- ANTENNE -->
    <line x1="400" y1="80" x2="400" y2="55" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="400" cy="52" r="6" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="fill" values="#38BDF8;#FFFFFF;#38BDF8" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- TÊTE -->
    <rect x="345" y="80" width="110" height="75" rx="18" ry="18" fill="url(#headGrad)" stroke="#38BDF8" stroke-width="2.5"/>
    <rect x="345" y="80" width="110" height="75" rx="18" ry="18" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.6"/>

    <!-- YEUX -->
    <g filter="url(#glow)">
      <circle cx="375" cy="112" r="10" fill="url(#eyeGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="0.15s" repeatCount="indefinite" begin="0s" end="4s"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="0.1s" repeatCount="indefinite" begin="6s" end="8s"/>
      </circle>
      <circle cx="425" cy="112" r="10" fill="url(#eyeGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="0.15s" repeatCount="indefinite" begin="0s" end="4s"/>
        <animate attributeName="opacity" values="1;0.4;1" dur="0.1s" repeatCount="indefinite" begin="6s" end="8s"/>
      </circle>
      <circle cx="375" cy="112" r="4" fill="#FFFFFF"/>
      <circle cx="425" cy="112" r="4" fill="#FFFFFF"/>
    </g>

    <!-- BOUCHE — égaliseur -->
    <g fill="#38BDF8">
      <rect x="380" y="138" width="4" height="6" rx="2">
        <animate attributeName="height" values="6;12;6" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="138;135;138" dur="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="388" y="138" width="4" height="8" rx="2">
        <animate attributeName="height" values="8;14;8" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="138;135;138" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="396" y="138" width="4" height="10" rx="2">
        <animate attributeName="height" values="10;16;10" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="138;135;138" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="404" y="138" width="4" height="8" rx="2">
        <animate attributeName="height" values="8;14;8" dur="0.55s" repeatCount="indefinite"/>
        <animate attributeName="y" values="138;135;138" dur="0.55s" repeatCount="indefinite"/>
      </rect>
      <rect x="412" y="138" width="4" height="6" rx="2">
        <animate attributeName="height" values="6;12;6" dur="0.65s" repeatCount="indefinite"/>
        <animate attributeName="y" values="138;135;138" dur="0.65s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- COU -->
    <rect x="385" y="155" width="30" height="12" rx="3" fill="#075985" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- CORPS -->
    <rect x="330" y="167" width="140" height="80" rx="20" ry="20" fill="url(#bodyGrad)" opacity="0.9"/>
    <rect x="330" y="167" width="140" height="80" rx="20" ry="20" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>

    <!-- PANNEAU POITRINE -->
    <rect x="365" y="185" width="70" height="45" rx="8" fill="#020617" stroke="#38BDF8" stroke-width="1.5"/>

    <!-- CŒUR IA — pulsation -->
    <circle cx="400" cy="207" r="12" fill="none" stroke="#38BDF8" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="10;14;10" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#38BDF8;#FFFFFF;#38BDF8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="207" r="5" fill="#38BDF8">
      <animate attributeName="r" values="4;7;4" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- BARRES DATA poitrine -->
    <g fill="#06B6D4" opacity="0.8">
      <rect x="372" y="222" width="6" height="4" rx="1">
        <animate attributeName="width" values="6;16;6" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="382" y="222" width="10" height="4" rx="1">
        <animate attributeName="width" values="10;20;10" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="396" y="222" width="8" height="4" rx="1">
        <animate attributeName="width" values="8;18;8" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="408" y="222" width="12" height="4" rx="1">
        <animate attributeName="width" values="12;22;12" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- BRAS GAUCHE -->
    <rect x="305" y="175" width="20" height="55" rx="10" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="315" cy="235" r="8" fill="#38BDF8">
      <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- BRAS DROIT -->
    <rect x="475" y="175" width="20" height="55" rx="10" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="485" cy="235" r="8" fill="#38BDF8">
      <animate attributeName="r" values="7;9;7" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- FLUX DE CODE / DATA — côté gauche -->
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#38BDF8" opacity="0.7">
    <text x="30" y="60">const ai = new NeuralNet();</text>
    <text x="30" y="85">model.fit(data);</text>
    <text x="30" y="110">loss.backward();</text>
    <text x="30" y="135">optimizer.step();</text>
    <text x="30" y="160">if (ready) deploy();</text>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- FLUX DE CODE — côté droit -->
  <g font-family="JetBrains Mono, monospace" font-size="11" fill="#06B6D4" opacity="0.7">
    <text x="580" y="60" text-anchor="start">import tensorflow</text>
    <text x="580" y="85" text-anchor="start">tf.keras.layers</text>
    <text x="580" y="110" text-anchor="start">y = model(x)</text>
    <text x="580" y="135" text-anchor="start">print(accuracy)</text>
    <text x="580" y="160" text-anchor="start">robot.navigate()</text>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" begin="1s" repeatCount="indefinite"/>
  </g>

  <!-- PARTICULES FLOTTANTES -->
  <g fill="#38BDF8">
    <circle cx="100" cy="200" r="2">
      <animate attributeName="cy" values="200;150;200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="180" r="2">
      <animate attributeName="cy" values="180;130;180" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="260" r="1.5">
      <animate attributeName="cy" values="260;220;260" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="250" r="1.5">
      <animate attributeName="cy" values="250;210;250" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- SCANLINE décorative -->
  <rect x="0" y="0" width="800" height="3" fill="#38BDF8" opacity="0.15">
    <animate attributeName="y" values="0;300;0" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
