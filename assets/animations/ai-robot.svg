<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-label="Robot IA animé">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <g transform="translate(400,180)">
    <line x1="0" y1="-80" x2="0" y2="-100" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="0" cy="-105" r="7" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="r" values="6;10;6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="-55" y="-80" width="110" height="75" rx="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="-25" cy="-48" r="9" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="-48" r="9" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <rect x="-15" y="-80" width="30" height="12" rx="3" fill="#075985"/>
    <rect x="-70" y="0" width="140" height="80" rx="20" fill="url(#body)" opacity="0.9"/>
    <rect x="-35" y="15" width="70" height="45" rx="8" fill="#020617" stroke="#38BDF8"/>
    <circle cx="0" cy="37" r="10" fill="none" stroke="#38BDF8" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="9;13;9" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="37" r="4" fill="#38BDF8"/>
  </g>
</svg>
