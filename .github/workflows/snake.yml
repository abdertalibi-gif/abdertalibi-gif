name: Contribution Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snek@v3
        with:
          github_user_name: abdertalibi-gif
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg
      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git init
          git add dist/
          git commit -m "Update contribution snake [skip ci]" || true
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/abdertalibi-gif/abdertalibi-gif.git
          git push -f origin HEAD:output || true
